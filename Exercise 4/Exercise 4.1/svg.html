<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ex 4.1 House</title>
</head>
<body>
  <h1>My House and Garden</h1>

  <svg viewBox="0 0 400 300" width="600" xmlns="http://www.w3.org/2000/svg" style="border:1px solid black">
    <rect x="0" y="200" width="400" height="100" fill="green"/>               

    <line x1="180" y1="220" x2="180" y2="300" stroke="gray" stroke-width="40"/>

    <rect x="100" y="120" width="160" height="100" fill="burlywood"/>        
    <polygon points="90,120 180,60 270,120" fill="firebrick"/>                
    <rect x="220" y="70" width="20" height="40" fill="gray"/>                 
    <polyline points="230,65 238,50 226,38 236,22" fill="none" stroke="lightgray" stroke-width="3"/>
    <rect x="165" y="160" width="30" height="60" fill="saddlebrown"/>         

    <g fill="lightblue" stroke="black" stroke-width="2">
      <rect x="0" y="0" width="35" height="35" transform="translate(115,140)"/>
      <rect x="0" y="0" width="35" height="35" transform="translate(215,140)"/>
    </g>

    <ellipse cx="55" cy="228" rx="40" ry="15" fill="deepskyblue" stroke="steelblue" stroke-width="3"/>

    <rect x="320" y="165" width="16" height="55" fill="saddlebrown"/>
    <circle cx="328" cy="145" r="35" fill="forestgreen"/>

    <path d="M20 270 Q50 240 80 270" fill="none" stroke="orange" stroke-width="3"/> <!-- garden arch -->
    <text x="110" y="30" font-size="20" fill="black">My House</text>
  </svg>
</body>
</html>
